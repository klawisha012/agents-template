name: Close finished parents

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-parents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Close parents whose sub-issues are all closed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: python3 .agents/workflow/close_parents.py --issue "$ISSUE"
