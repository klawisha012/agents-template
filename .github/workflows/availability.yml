name: Set availability

on:
  workflow_dispatch:
    inputs:
      status:
        description: Availability
        type: choice
        options:
          - working
          - away
        default: working
        required: true
      login:
        description: GitHub login of the person who left (optional; defaults to you)
        type: string
        required: false

permissions:
  contents: write
  actions: write

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Select the default branch when running this workflow.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Save availability and request reconciliation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
          STATUS: ${{ inputs.status }}
          LEFT_LOGIN: ${{ inputs.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          saved=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "$DEFAULT_BRANCH"
            git checkout -B availability-update FETCH_HEAD
            if [ ! -f .agents/team.json ]; then
              echo 'Configure and commit .agents/team.json first.' >&2
              exit 1
            fi
            case "$STATUS" in
              working)
                if [ -n "$LEFT_LOGIN" ]; then
                  echo 'Leave login empty for working; the initiating account is used.' >&2
                  exit 1
                fi
                python3 .agents/workflow/availability.py --team .agents/team.json --login "$ACTOR" --hours 8 ;;
              away)
                if [ -z "$LEFT_LOGIN" ]; then
                  LEFT_LOGIN="$ACTOR"
                fi
                python3 .agents/workflow/availability.py --team .agents/team.json --login "$LEFT_LOGIN" --away ;;
              *) echo 'Invalid availability status.' >&2; exit 1 ;;
            esac
            if git diff --quiet -- .agents/team.json; then
              saved=true
              break
            fi
            git add .agents/team.json
            git commit -m 'Update availability'
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              saved=true
              break
            fi
            echo "Push failed (attempt $attempt); retrying from the latest branch." >&2
          done
          if [ "$saved" != true ]; then
            echo 'Could not save availability. Check branch protection and Actions permissions.' >&2
            exit 1
          fi
          # Pushes made with GITHUB_TOKEN do not trigger the push workflow.
          if ! gh workflow run availability-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"; then
            echo 'Availability was saved, but reconciliation could not be started. Run Reconcile issue owners manually.' >&2
            exit 1
          fi
          echo 'Availability saved; reconciliation requested. Check the Reconcile issue owners run for results.'
