name: Reconcile issue owners

on:
  workflow_dispatch:
  push:
    paths:
      - .agents/team.json
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-owner-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Distribute and hand off eligible issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .agents/team.json ]; then
            python3 .agents/workflow/reconcile.py --team .agents/team.json --apply
          else
            echo 'No roster configured; no issues changed.'
          fi
